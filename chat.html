<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>索骥 MediaSeek · AI 对话</title>
<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
<script src="https://unpkg.com/marked@12.0.2/marked.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Microsoft YaHei', sans-serif; background: #f5f5f5; color: #333; min-height: 100vh; }
.header { background: #fff; padding: 20px; text-align: center; border-bottom: 1px solid #e0e0e0; box-shadow: 0 2px 8px rgba(0,0,0,0.06); display: flex; align-items: center; justify-content: center; gap: 16px; }
.header h1 { font-size: 22px; font-weight: 500; }
.header a { font-size: 14px; color: #1a73e8; text-decoration: none; }
.container { max-width: 720px; margin: 0 auto; padding: 20px 16px; height: calc(100vh - 80px); display: flex; flex-direction: column; }

/* 聊天区 */
.chat-messages { flex: 1; overflow-y: auto; padding: 16px; background: #fff; border-radius: 12px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); margin-bottom: 12px; }
.chat-msg { margin-bottom: 14px; display: flex; gap: 8px; align-items: flex-start; }
.chat-msg.user { justify-content: flex-end; }
.chat-avatar { width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; }
.chat-msg.assistant .chat-avatar { background: #e8f5e9; }
.chat-msg.user .chat-avatar { background: #e3f2fd; order: 2; }
.chat-bubble { max-width: 70%; padding: 10px 14px; border-radius: 12px; font-size: 14px; line-height: 1.7; white-space: normal; overflow-wrap: break-word; word-break: break-word; }
.chat-bubble table { border-collapse: collapse; width: 100%; margin: 6px 0; font-size: 13px; background: #fff; }
.chat-bubble th, .chat-bubble td { border: 1px solid #c8e6c9; padding: 4px 8px; text-align: left; }
.chat-bubble th { background: #d7efd9; font-weight: 600; }
.chat-bubble ul, .chat-bubble ol { margin: 6px 0 6px 20px; }
.chat-bubble p { margin: 5px 0; }
.chat-bubble code { background: #fff; padding: 1px 4px; border-radius: 4px; font-size: 13px; }
.chat-msg.assistant .chat-bubble { background: #e8f5e9; border-top-left-radius: 2px; }
.chat-msg.user .chat-bubble { background: #e3f2fd; border-top-right-radius: 2px; }
.chat-msg .refs { font-size: 11px; color: #888; margin-top: 6px; }
.chat-msg .refs span { cursor: pointer; color: #1a73e8; text-decoration: underline; margin-right: 8px; }
.chat-time { font-size: 11px; color: #bbb; margin-top: 2px; }
.chat-loading .chat-bubble { color: #999; }

/* 输入区 */
.chat-input-row { display: flex; gap: 8px; }
.chat-input-row input { flex: 1; padding: 12px 16px; border: 2px solid #e0e0e0; border-radius: 24px; outline: none; font-size: 14px; }
.chat-input-row input:focus { border-color: #1a73e8; }
.chat-input-row button { padding: 10px 20px; border: none; border-radius: 24px; cursor: pointer; font-size: 14px; color: #fff; }
.btn-send { background: #0d904f; } .btn-send:hover { background: #0a6f3c; }
.btn-send:disabled { background: #ccc; }
.btn-clear { background: #ddd; color: #666; }
.btn-clear:hover { background: #ccc; }

/* 预览弹窗 */
.modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 100; justify-content: center; align-items: center; }
.modal.show { display: flex; }
.modal-content { background: #fff; border-radius: 12px; padding: 24px; max-width: 800px; max-height: 90vh; overflow: auto; }
.modal-content img { max-width: 100%; max-height: 65vh; border-radius: 8px; display: block; margin: 0 auto; }
.modal-content video { max-width: 100%; max-height: 65vh; border-radius: 8px; }
.modal-content audio { width: 100%; margin: 20px 0; }
.modal-content .close { float: right; font-size: 28px; cursor: pointer; color: #999; line-height: 1; }
.modal-content .close:hover { color: #333; }
.modal-content .meta { margin-top: 16px; padding: 12px; background: #f5f5f5; border-radius: 8px; font-size: 13px; color: #666; line-height: 1.8; }
.modal-content a { color: #1a73e8; text-decoration: none; }
.empty { text-align: center; color: #ccc; padding: 60px 0; }
.spinner { display: inline-block; width: 16px; height: 16px; border: 3px solid #e0e0e0; border-top-color: #0d904f; border-radius: 50%; animation: spin 0.8s linear infinite; vertical-align: middle; margin-right: 6px; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (max-width: 768px) { .container { max-width: 100%; padding: 12px; height: calc(100vh - 60px); } .header { padding: 12px 8px; } .chat-bubble { max-width: 90%; } .chat-input-row { gap: 4px; } }
</style>
</head>
<body>

<div id="app">
  <div class="header">
    <h1>索骥 MediaSeek · AI 对话</h1>
    <a href="/">检索</a>
    <a href="/chat" style="color:#0d904f;font-weight:600;">对话</a>
    <a href="/admin">入库</a>
  </div>

  <div class="container">
    <div class="chat-messages" ref="chatBox">
      <div v-if="chatMessages.length === 0" class="empty">
        <div style="font-size:48px;margin-bottom:12px;">&#x1F4AC;</div>
        <div>输入问题开始对话，AI 会基于资料库回答</div>
        <div style="font-size:13px;margin-top:8px;">试试: "非遗有哪些展示"</div>
      </div>
      <div v-for="(msg, i) in chatMessages" :key="i" :class="'chat-msg ' + msg.role">
        <div class="chat-avatar">{{ msg.role === 'assistant' ? '🤖' : '👤' }}</div>
        <div>
          <div class="chat-bubble">
            <span v-html="md(msg.content)"></span>
            <div class="refs" v-if="msg.refs && msg.refs.length">
              参考:
              <span v-for="(r, j) in msg.refs" :key="j" @click="showPreview(r)">
                [{{ r.db_type }}] {{ r.file_name }}
              </span>
            </div>
          </div>
          <div class="chat-time">{{ msg.time }} <a v-if="msg.role==='assistant'" href="#" @click.prevent="copyMsg(msg)" style="font-size:11px;color:#1a73e8;margin-left:8px;">拷贝</a></div>
        </div>
      </div>
      <div v-if="chatLoading" class="chat-msg assistant chat-loading">
        <div class="chat-avatar">🤖</div>
        <div class="chat-bubble"><span class="spinner"></span>思考中...</div>
      </div>
    </div>

    <div class="chat-input-row">
      <input v-model="chatInput" type="text" placeholder="输入消息，Enter 发送..."
             @keydown.enter="doChat" :disabled="chatLoading" ref="inputBox">
      <button v-if="!chatLoading" class="btn-send" @click="doChat" :disabled="!chatInput.trim()">发送</button>
      <button v-else class="btn-send" style="background:#d32f2f;" @click="stopChat">停止</button>
      <button class="btn-clear" @click="clearChat">清空</button>
    </div>
  </div>

  <!-- 预览弹窗 -->
  <div :class="['modal', { show: modalVisible }]" @click="closeModal">
    <div class="modal-content" @click.stop>
      <span class="close" @click="closeModal">&times;</span>
      <div v-html="modalBody"></div>
      <div class="meta" v-html="modalMeta"></div>
    </div>
  </div>
</div>

<script>
const { createApp } = Vue

createApp({
  data() {
    return {
      chatInput: '', chatMessages: [], chatLoading: false,
      sessionId: 's' + Date.now(), abortCtrl: null,
      modalVisible: false, modalBody: '', modalMeta: '',
    }
  },
  mounted() {
    this.$refs.inputBox?.focus()
    window.addEventListener('keydown', this.onKeyDown)
  },
  beforeUnmount() { window.removeEventListener('keydown', this.onKeyDown) },
  methods: {
    // 轻量 Markdown 渲染：先转义 HTML 再交给 marked，避免资料里的尖括号被执行
    md(s) {
      if (!s) return ''
      const esc = String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      if (window.marked) { try { return marked.parse(esc) } catch (e) { console.warn(e) } }
      return esc.replace(/\n/g, '<br>')
    },
    async doChat() {
      if (!this.chatInput.trim() || this.chatLoading) return
      const q = this.chatInput.trim(); this.chatInput = ''
      this.chatMessages.push({ role: 'user', content: q, time: new Date().toLocaleTimeString() })
      this.chatLoading = true; this.scrollToBottom()

      this.abortCtrl = new AbortController()
      try {
        const resp = await fetch('/chat', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ query: q, session_id: this.sessionId }),
          signal: this.abortCtrl.signal
        })
        const data = await resp.json()
        this.chatMessages.push({ role: 'assistant', content: data.answer, refs: data.references || [], time: new Date().toLocaleTimeString() })
      } catch (e) {
        if (e.name !== 'AbortError') this.chatMessages.push({ role: 'assistant', content: '请求失败: ' + e, time: new Date().toLocaleTimeString() })
      }
      this.chatLoading = false; this.abortCtrl = null; this.scrollToBottom()
    },
    stopChat() { if (this.abortCtrl) { this.abortCtrl.abort(); this.chatLoading = false } },
    clearChat() { if (this.chatMessages.length === 0 || confirm('确认清空全部对话记录？')) { this.chatMessages = []; this.sessionId = 's' + Date.now() } },
    copyMsg(msg) { navigator.clipboard.writeText(msg.content).then(() => alert('已复制')) },
    scrollToBottom() {
      this.$nextTick(() => {
        const box = this.$refs.chatBox; if (box) box.scrollTop = box.scrollHeight
      })
    },
    showPreview(r) {
      if (!r.file_path) return
      const u = '/files/' + r.file_path.split('/').map(s => encodeURIComponent(s)).join('/')
      this.modalMeta = `<b>${r.file_name}</b><br>类型: ${r.db_type}`
      if (r.db_type === 'image') this.modalBody = `<img src="${u}" onerror="this.outerHTML='<p>预览失败</p>'">`
      else if (r.db_type === 'video') this.modalBody = `<video controls><source src="${u}" type="video/mp4"></video>`
      else if (r.db_type === 'audio') this.modalBody = `<audio controls><source src="${u}"></audio>`
      else this.modalBody = `<p style="text-align:center;padding:30px"><a href="${u}" target="_blank">打开 PDF</a></p>`
      this.modalVisible = true
    },
    onKeyDown(e) { if (e.key === 'Escape' && this.modalVisible) this.modalVisible = false },
    closeModal() { this.modalVisible = false; this.modalBody = '' }
  }
}).mount('#app')
</script>
</body>
</html>
